<!-- @dsCard group="Components" viewport="700x300" name="Ícones xilográficos" subtitle="Navegação, interface e faces de preferência" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:24px; background:var(--bg-app); font-family:var(--font-sans); color:var(--text-strong); }
  .grp { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.18em; color:var(--text-muted); margin:0 0 12px; }
  .icons { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:22px; }
  .ic { display:flex; flex-direction:column; align-items:center; gap:7px; width:62px; }
  .ic .cap { font-size:10.5px; color:var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Icon } = window.CasaComigoDesignSystem_64c258;
  const NAV = ['calendar','clipboard','heart','users','chart'];
  const UI = ['clock','house','check','plus','repeat','alert','zap','userplus','arrowleft','x'];
  const FACES = [['sad','var(--vermelho)'],['neutral','var(--ocre)'],['happy','var(--verde)']];
  function Row({ items }) {
    return <div className="icons">{items.map((n) => (
      <div className="ic" key={n}><Icon name={n} size={30} /><span className="cap">{n}</span></div>
    ))}</div>;
  }
  function Demo() {
    return (
      <div>
        <p className="grp">Navegação</p><Row items={NAV} />
        <p className="grp">Interface</p><Row items={UI} />
        <p className="grp">Faces de preferência</p>
        <div className="icons">{FACES.map(([n,c]) => (
          <div className="ic" key={n}><Icon name={n} size={34} color={c} /><span className="cap">{n}</span></div>
        ))}</div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
