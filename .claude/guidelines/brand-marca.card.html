<!-- @dsCard group="Brand" viewport="700x200" name="Marca — Sol do Sertão" subtitle="Carimbo radial + lockup tipográfico" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:28px; background:var(--bg-app); display:flex; gap:40px; align-items:center; flex-wrap:wrap; }
  .lockup { display:flex; align-items:center; gap:16px; }
  .nome { font-family:var(--font-display); text-transform:uppercase; font-size:30px; line-height:1; color:var(--text-strong); white-space:nowrap; }
  .sub { font-family:var(--font-sans); font-size:12.5px; color:var(--barro); font-weight:600; }
  .onink { background:var(--tinta); border-radius:var(--radius-lg); padding:20px 26px; display:flex; align-items:center; gap:14px; }
  .onink .nome { color:var(--papel); font-size:24px; }
</style></head>
<body>
  <div class="lockup">
    <span class="cc-sol" style="width:64px; height:64px;"></span>
    <div>
      <div class="nome">Casa Comigo</div>
      <div class="sub">gestão doméstica colaborativa</div>
    </div>
  </div>
  <div class="onink">
    <span class="cc-sol cc-sol--claro" style="width:46px; height:46px;"></span>
    <div class="nome">Casa Comigo</div>
  </div>
</body></html>
