<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:26px; background:var(--bg-app); }
  .spec { font-family:var(--font-sans); font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.12em; }
  .line { display:flex; align-items:baseline; justify-content:space-between; gap:18px; padding:10px 0; border-bottom:1px solid var(--border-faint); }
  .d { font-family:var(--font-display); text-transform:uppercase; line-height:1; color:var(--text-strong); }
</style></head>
<body>
  <div class="line"><span class="d" style="font-size:64px;">A casa é mutirão</span><span class="spec">Display XL</span></div>
  <div class="line"><span class="d" style="font-size:44px;">Distribuir tarefas</span><span class="spec">Display MD · 44</span></div>
  <div class="line"><span class="d" style="font-size:30px;">Cronograma da semana</span><span class="spec">Display SM · 30</span></div>
  <div class="line" style="border:none;"><span class="d" style="font-size:30px; color:var(--barro);">54%&nbsp;·&nbsp;128</span><span class="spec">Números de cartaz</span></div>
</body></html>
