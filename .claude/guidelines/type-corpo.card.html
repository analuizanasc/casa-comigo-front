<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:26px; background:var(--bg-app); font-family:var(--font-sans); color:var(--text-strong); }
  .spec { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.12em; }
  .line { display:flex; align-items:baseline; justify-content:space-between; gap:18px; padding:11px 0; border-bottom:1px solid var(--border-faint); }
</style></head>
<body>
  <div class="line"><span style="font-size:24px; font-weight:700; letter-spacing:-.01em;">Seção · Membros da casa</span><span class="spec">Título · 24/700</span></div>
  <div class="line"><span style="font-size:20px; font-weight:700;">Aguar plantas</span><span class="spec">Item · 20/700</span></div>
  <div class="line"><span style="font-size:16px;">Texto de corpo para descrições e instruções da casa, com leitura confortável.</span><span class="spec">Corpo · 16/400</span></div>
  <div class="line" style="border:none;"><span style="font-size:14px; color:var(--text-body);">Metadado e legenda secundária</span><span class="spec">Meta · 14</span></div>
</body></html>
