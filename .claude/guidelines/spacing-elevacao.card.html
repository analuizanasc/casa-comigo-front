<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:30px 26px; background:var(--bg-app); font-family:var(--font-sans); }
  .row { display:flex; gap:24px; flex-wrap:wrap; }
  .item { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .box { width:96px; height:60px; background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-md); }
  .n { font-size:11.5px; font-weight:700; }
  .t { font-size:11px; color:var(--text-muted); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm);"></div><div class="n">SM</div><div class="t">repouso</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md);"></div><div class="n">MD · cartão</div><div class="t">flutuante</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg);"></div><div class="n">LG</div><div class="t">elevado</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-barro);"></div><div class="n">Barro</div><div class="t">ação</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-carimbo); border:2px solid var(--tinta); border-radius:var(--radius-carimbo);"></div><div class="n">Carimbo</div><div class="t">acento</div></div>
  </div>
</body></html>
