<!-- @dsCard group="Brand" viewport="700x250" name="Iconografia — xilográfica" subtitle="Traço marcante de gravura; recortes de papel" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px; background:var(--bg-app); font-family:var(--font-sans); color:var(--text-strong); }
  .icons { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  .ic { display:flex; flex-direction:column; align-items:center; gap:8px; width:74px; }
  .ic .cap { font-size:11px; color:var(--text-muted); text-align:center; }
  .note { margin-top:18px; font-size:13px; color:var(--text-body); max-width:64ch; }
  .note b { color:var(--text-strong); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel">
  const { Icon } = window.CasaComigoDesignSystem_64c258;
  const NAV = [['calendar','Cronograma'],['clipboard','Catálogo'],['heart','Preferências'],['users','Membros'],['chart','Relatórios']];
  function Demo() {
    return (
      <div>
        <div className="icons">
          {NAV.map(([n,l]) => (
            <div className="ic" key={n}>
              <Icon name={n} size={44} paper="var(--papel-branco)" />
              <span className="cap">{l}</span>
            </div>
          ))}
        </div>
        <p className="note"><b>Ícones xilográficos</b> derivados das referências de gravura: traço marcante em <code>currentColor</code>, recortes claros no papel. Cobrem a navegação e os controles. As <b>faces</b> (👎😐👍 → <i>sad/neutral/happy</i>) substituem os emojis nas preferências.</p>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
