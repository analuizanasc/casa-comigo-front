<!-- @dsCard group="Spacing" viewport="700x170" name="Raio de canto" subtitle="Macio e moderno; carimbo = quase reto" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:26px; background:var(--bg-app); font-family:var(--font-sans); }
  .row { display:flex; gap:18px; flex-wrap:wrap; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width:74px; height:60px; background:var(--surface-card); border:1px solid var(--border-strong); box-shadow:var(--shadow-sm); }
  .n { font-size:11.5px; font-weight:700; }
  .t { font-size:11px; color:var(--text-muted); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-carimbo);"></div><div class="n">Carimbo</div><div class="t">4px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm);"></div><div class="n">SM</div><div class="t">10px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md);"></div><div class="n">MD · cartão</div><div class="t">14px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg);"></div><div class="n">LG</div><div class="t">20px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl);"></div><div class="n">XL</div><div class="t">28px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-full); width:60px;"></div><div class="n">Full</div><div class="t">pílula</div></div>
  </div>
</body></html>
