<!-- @dsCard group="Colors" viewport="700x150" name="Tinta & Barro — base e ação" subtitle="Texto/traço e terracota da ação primária" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:22px; background:var(--bg-app); font-family:var(--font-sans); }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .sw { border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow-sm); background:var(--surface-card); }
  .chip { height:64px; }
  .info { padding:10px 12px; }
  .nome { font-weight:700; font-size:13.5px; }
  .hex { font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .role { font-size:11px; color:var(--text-muted); margin-top:2px; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--tinta)"></div><div class="info"><div class="nome">Tinta</div><div class="hex">#211A12</div><div class="role">Texto / traço</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tinta-suave)"></div><div class="info"><div class="nome">Tinta Suave</div><div class="hex">#5B4F3E</div><div class="role">Texto secundário</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--barro)"></div><div class="info"><div class="nome">Barro</div><div class="hex">#B14A28</div><div class="role">Ação primária</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--barro-fundo)"></div><div class="info"><div class="nome">Barro Fundo</div><div class="hex">#8C3618</div><div class="role">Pressão / hover</div></div></div>
  </div>
</body></html>
