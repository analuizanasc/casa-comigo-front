<!-- @dsCard group="Colors" viewport="700x150" name="Acentos nordestinos" subtitle="Anil, verde-caatinga, sol do sertão, vermelho-barro" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:22px; background:var(--bg-app); font-family:var(--font-sans); }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .sw { border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow-sm); background:var(--surface-card); }
  .chip { height:64px; }
  .info { padding:10px 12px; }
  .nome { font-weight:700; font-size:13.5px; }
  .hex { font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .role { font-size:11px; color:var(--text-muted); margin-top:2px; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--indigo)"></div><div class="info"><div class="nome">Anil</div><div class="hex">#2C4A5A</div><div class="role">Informação / pendente</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--verde)"></div><div class="info"><div class="nome">Verde-Caatinga</div><div class="hex">#5E7440</div><div class="role">Leve / sucesso</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ocre)"></div><div class="info"><div class="nome">Sol do Sertão</div><div class="hex">#C9892B</div><div class="role">Médio / atenção</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--vermelho)"></div><div class="info"><div class="nome">Vermelho-Barro</div><div class="hex">#A12E1C</div><div class="role">Pesado / perigo</div></div></div>
  </div>
</body></html>
