<!-- @dsCard group="Spacing" viewport="700x170" name="Escala de espaço" subtitle="Base 4 — do respiro fino ao bloco de seção" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:26px; background:var(--bg-app); font-family:var(--font-sans); }
  .row { display:flex; align-items:flex-end; gap:16px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar { background:var(--barro); border-radius:var(--radius-xs); width:26px; }
  .t { font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .n { font-size:11px; font-weight:700; color:var(--text-strong); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px;"></div><div class="n">1</div><div class="t">4px</div></div>
    <div class="item"><div class="bar" style="height:8px;"></div><div class="n">2</div><div class="t">8px</div></div>
    <div class="item"><div class="bar" style="height:12px;"></div><div class="n">3</div><div class="t">12px</div></div>
    <div class="item"><div class="bar" style="height:16px;"></div><div class="n">4</div><div class="t">16px</div></div>
    <div class="item"><div class="bar" style="height:24px;"></div><div class="n">5</div><div class="t">24px</div></div>
    <div class="item"><div class="bar" style="height:32px;"></div><div class="n">6</div><div class="t">32px</div></div>
    <div class="item"><div class="bar" style="height:48px;"></div><div class="n">7</div><div class="t">48px</div></div>
    <div class="item"><div class="bar" style="height:64px;"></div><div class="n">8</div><div class="t">64px</div></div>
  </div>
</body></html>
