<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Comigo · App</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; }
  #root { min-height: 100vh; }
  .cc-content { padding: 36px 44px 80px; max-width: 1040px; }
  @media (max-width: 880px) { .cc-content { padding: 24px 24px 24px 12px; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>

<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens2.jsx"></script>
<script type="text/babel" src="login.jsx"></script>
<script type="text/babel">
  const { useState } = React;

  function App() {
    const [view, setView] = useState('login');   // 'login' | nav key
    const SCREENS = {
      schedule: window.Schedule,
      catalog: window.Catalog,
      preferences: window.Preferences,
      members: window.Members,
      reports: window.Reports,
    };

    if (view === 'login') {
      return <window.Login onEnter={() => setView('schedule')} />;
    }
    const Screen = SCREENS[view] || window.Schedule;
    return (
      <div style={{ display: 'flex', minHeight: '100vh' }}>
        <window.Sidebar active={view} onNavigate={setView} onLeave={() => setView('login')} />
        <main className="cc-content" style={{ flex: 1, minWidth: 0 }}>
          <Screen />
        </main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
