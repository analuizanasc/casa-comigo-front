<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Tela do App Casa Comigo" description="Shell de tela com sidebar (Sol do Sertão) e conteúdo composto pelos componentes do design system." -->
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  html, body { margin: 0; }
  body { background: var(--bg-app); color: var(--text-strong); font-family: var(--font-sans), system-ui, sans-serif; }
</style>
<script src="./ds-base.js"></script>
</helmet>

<div style="display:flex; min-height:100vh;">

  <aside style="width:268px; flex:none; background:var(--surface-soft); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0; height:100vh;">
    <div style="display:flex; align-items:center; gap:12px; padding:4px 8px 20px;">
      <span class="cc-sol" style="width:40px; height:40px; flex:none;"></span>
      <div>
        <div style="font-family:var(--font-display); text-transform:uppercase; font-size:17px; line-height:1.04;">Casa Comigo</div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">Apartamento 404</div>
      </div>
    </div>
    <nav style="display:flex; flex-direction:column; gap:4px; margin-top:6px; font-size:15.5px; font-weight:600;">
      <a style="display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:var(--radius-sm); color:var(--barro-fundo); background:var(--barro-claro); border:1px solid rgba(177,74,40,0.35); font-weight:700; text-decoration:none;">Cronograma</a>
      <a style="display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:var(--radius-sm); color:var(--text-body); text-decoration:none;">Catálogo</a>
      <a style="display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:var(--radius-sm); color:var(--text-body); text-decoration:none;">Preferências</a>
      <a style="display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:var(--radius-sm); color:var(--text-body); text-decoration:none;">Membros</a>
      <a style="display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:var(--radius-sm); color:var(--text-body); text-decoration:none;">Relatórios</a>
    </nav>
    <div style="margin-top:auto; padding-top:16px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px;">
      <x-import component-from-global-scope="CasaComigoDesignSystem_64c258.Avatar" name="qa" tone="barro" size="34" hint-size="34px,34px"></x-import>
      <div>
        <div style="font-weight:700; font-size:14px;">qa</div>
        <span style="font-size:13px; color:var(--barro); font-weight:600;">Sair</span>
      </div>
    </div>
  </aside>

  <main style="flex:1; min-width:0; padding:36px 44px 80px; max-width:1040px;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:28px;">
      <div>
        <div class="cc-eyebrow">Mutirão da semana</div>
        <h1 class="cc-display" style="font-size:var(--display-md); margin-top:6px;">Cronograma</h1>
        <p style="margin:8px 0 0; font-size:15px; color:var(--text-muted);">2 tarefas no período</p>
      </div>
      <x-import component-from-global-scope="CasaComigoDesignSystem_64c258.Button" variant="primary" size="lg" hint-size="200px,48px">Distribuir tarefas</x-import>
    </div>

    <div style="display:flex; flex-direction:column; gap:16px;">

      <x-import component-from-global-scope="CasaComigoDesignSystem_64c258.Card" interactive="{{ true }}" hint-size="100%,150px">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
          <h3 style="font-size:20px; font-weight:700;">Aguar plantas</h3>
          <x-import component-from-global-scope="CasaComigoDesignSystem_64c258.Badge" variant="info" dot="{{ true }}" hint-size="96px,24px">Pendente</x-import>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
          <x-import component-from-global-scope="CasaComigoDesignSystem_64c258.Badge" variant="sage" hint-size="60px,24px">Leve</x-import>
          <x-import component-from-global-scope="CasaComigoDesignSystem_64c258.Tag" hint-size="76px,24px">15min</x-import>
        </div>
      </x-import>

      <x-import component-from-global-scope="CasaComigoDesignSystem_64c258.Card" interactive="{{ true }}" hint-size="100%,150px">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
          <h3 style="font-size:20px; font-weight:700;">Lavar roupa</h3>
          <x-import component-from-global-scope="CasaComigoDesignSystem_64c258.Badge" variant="success" dot="{{ true }}" hint-size="100px,24px">Concluída</x-import>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
          <x-import component-from-global-scope="CasaComigoDesignSystem_64c258.Badge" variant="warning" hint-size="64px,24px">Médio</x-import>
          <x-import component-from-global-scope="CasaComigoDesignSystem_64c258.Tag" hint-size="76px,24px">30min</x-import>
        </div>
      </x-import>

    </div>
  </main>
</div>

</x-dc>
</body>
</html>
