name: CI — Casa Comigo Front

# ─────────────────────────────────────────────────────
# GATILHOS
# ─────────────────────────────────────────────────────
on:
  # 1. A cada push nas branches principais
  push:
    branches: [main, develop]

  # 2. Em pull requests direcionados a main ou develop
  pull_request:
    branches: [main, develop]

  # 3. Execução manual com seleção de versão do Node
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Versão do Node.js'
        required: false
        default: '20'
        type: choice
        options: ['18', '20', '22']

  # 4. Agendamento diário: 06:00 UTC (03:00 BRT), seg–sex
  schedule:
    - cron: '0 6 * * 1-5'

# ─────────────────────────────────────────────────────
# CONCORRÊNCIA
# Cancela execuções anteriores na mesma branch ao fazer
# novo push, evitando desperdício de recursos.
# ─────────────────────────────────────────────────────
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────
# VARIÁVEIS GLOBAIS
# ─────────────────────────────────────────────────────
env:
  NODE_VERSION: ${{ inputs.node_version || '20' }}

# ─────────────────────────────────────────────────────
# PERMISSÕES
# Mínimo necessário: leitura do repo + escrita de checks
# para publicar o relatório de testes no GitHub.
# ─────────────────────────────────────────────────────
permissions:
  contents: read
  checks: write

jobs:
  # ═══════════════════════════════════════════════════
  # JOB 1 — QUALIDADE DE CÓDIGO
  # Lint e type-check rodam primeiro (fail-fast).
  # Se falharem, os testes não são executados.
  # ═══════════════════════════════════════════════════
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'  # Cache do ~/.npm entre execuções

      - name: Instalar dependências
        run: npm ci  # Instalação determinística via package-lock.json

      - name: Lint — ESLint
        run: npm run lint

      - name: Type check — TypeScript
        run: npx tsc --noEmit

  # ═══════════════════════════════════════════════════
  # JOB 2 — TESTES UNITÁRIOS & COBERTURA
  # Só executa se o job de qualidade passar (needs).
  # Gera: relatório JUnit, cobertura HTML, LCOV e JSON.
  # ═══════════════════════════════════════════════════
  test:
    name: Testes Unitários & Cobertura
    runs-on: ubuntu-latest
    needs: quality  # Depende do job de qualidade

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com cobertura
        run: npm run test:ci
        env:
          CI: true
          # Configuração do jest-junit via variáveis de ambiente
          JEST_JUNIT_OUTPUT_DIR: ./test-results
          JEST_JUNIT_OUTPUT_NAME: junit.xml
          JEST_JUNIT_SUITE_NAME: 'Casa Comigo — Testes Unitários'
          JEST_JUNIT_CLASSNAME: '{classname}'
          JEST_JUNIT_TITLE: '{title}'
          JEST_JUNIT_ADD_FILE_ATTRIBUTE: 'true'

      # Publica o XML como check nativo do GitHub (aba "Tests")
      - name: Publicar resultados dos testes
        uses: dorny/test-reporter@v1
        if: always()  # Executa mesmo se os testes falharem
        with:
          name: Resultados dos Testes
          path: test-results/junit.xml
          reporter: jest-junit
          fail-on-error: false  # Não bloqueia por falha de parse do reporter

      # Gera sumário de cobertura no Job Summary do GitHub
      - name: Sumário de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Cobertura de Código" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Categoria | Porcentagem | Cobertas | Total |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|:-----------:|:--------:|:-----:|" >> $GITHUB_STEP_SUMMARY
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const icon = pct => pct >= 80 ? 'OK' : 'FALHOU';
              ['statements','branches','functions','lines'].forEach(k => {
                const d = s[k];
                process.stdout.write('| ' + k + ' | ' + icon(d.pct) + ' ' + d.pct + '% | ' + d.covered + ' | ' + d.total + ' |\n');
              });
            " >> $GITHUB_STEP_SUMMARY
          fi

      # Armazena o relatório JUnit como artefato baixável
      - name: Upload — Resultados JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-junit
          path: test-results/
          retention-days: 30

      # Armazena o relatório HTML de cobertura como artefato
      - name: Upload — Relatório de Cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ═══════════════════════════════════════════════════
  # JOB 3 — BUILD DE PRODUÇÃO
  # Valida que o projeto compila sem erros após os testes.
  # O artefato dist/ fica disponível para deploy posterior.
  # ═══════════════════════════════════════════════════
  build:
    name: Build de Produção
    runs-on: ubuntu-latest
    needs: test  # Só builda se os testes passarem

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção (Vite)
        run: npm run build

      - name: Upload — Artefato de Build
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
